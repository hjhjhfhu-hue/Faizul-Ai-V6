name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Create debug.keystore
      run: |
        mkdir -p ~/.android
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -s "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        cp debug.keystore ~/.android/debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup .env file
      run: |
        if [ ! -f ".env" ]; then
          cp .env.example .env
        fi

    - name: Build Debug APK
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx2048m"
        GRADLE_OPTS: "-Djava.awt.headless=true -Dksp.daemon.jvm.options=-Djava.awt.headless=true"
      run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Faizul-AI-APK
        path: app/build/outputs/apk/debug/*.apk
